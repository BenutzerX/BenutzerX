<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BenutzerX | Contributions</title>
<meta name="description" content="Apps and projects BenutzerX has contributed to as a translator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#14213D; --muted:#5A6580;
  --line:#D5DAE5; --accent:#3345C9; --mark:#FFD84D;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1524; --surface:#171F33; --ink:#EEF1F8; --muted:#9AA5C0;
    --line:#2A3452; --accent:#8C9BFF;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:1.0625rem; line-height:1.6;
}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:4px}
.wrap{max-width:60rem; margin:0 auto; padding:0 1.5rem}


/* Hero */
.hero{padding:4rem 0 3rem; display:grid; gap:1.5rem 2.5rem; grid-template-columns:1.1fr 1fr; align-items:center}
.hero h1{
  grid-column:1 / -1; font-size:clamp(1.7rem,4.4vw,2.9rem); line-height:1.1; letter-spacing:-.025em;
  font-weight:800; margin:0 0 1.25rem;
}
.hero p{color:var(--muted); max-width:34rem; margin:0}

/* Snippet in stile file .po: l'elemento memorabile */
.po{
  background:var(--surface); border:1px solid var(--line); border-radius:.75rem;
  padding:1.25rem 1.4rem; font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  font-size:.9rem; line-height:1.9; box-shadow:0 1px 0 var(--line), 6px 6px 0 var(--accent);
}
.po .c{color:var(--muted)}
.po .k{color:var(--accent); font-weight:500}
.po .msg{display:block; min-height:1.9em}
.po mark{background:var(--mark); color:#14213D; padding:0 .3em; border-radius:.2em}
.po .caret{display:inline-block; width:.55ch; height:1.1em; background:var(--ink); vertical-align:text-bottom; animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Progetti */
section{padding:3rem 0}
h2{font-size:1.75rem; letter-spacing:-.02em; margin:0 0 .5rem}
.lead{color:var(--muted); margin:0 0 1.75rem}
.filters{display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1.5rem}
.filters button{
  font:inherit; font-size:.9rem; font-weight:600; cursor:pointer;
  background:transparent; color:var(--ink); border:1px solid var(--line);
  padding:.35rem .9rem; border-radius:99px;
}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.group{
  --g:var(--accent);
  background:var(--g); color:#14213D;
  border-radius:1rem; padding:1.5rem 1.5rem 1.25rem; margin-bottom:2.5rem;
}
.group-head{display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding-bottom:1rem}
.gicon{
  flex:none; width:3.25rem; height:3.25rem; border-radius:.8rem; font-size:1.7rem;
  display:grid; place-items:center; background:rgba(255,255,255,.6);
}
.group-head .txt{flex:1; min-width:0}
.group-head h3{margin:0; font-size:1.35rem; letter-spacing:-.01em; line-height:1.2}
.group-head p{margin:0; color:rgba(20,33,61,.75); font-size:.95rem}
.group-head a{
  white-space:nowrap; font-weight:600; text-decoration:none; color:#14213D;
  background:#fff; padding:.45rem 1rem; border-radius:99px; font-size:.9rem;
}
.group-head a:hover{background:#14213D; color:#fff}
.group a:focus-visible{outline-color:#14213D}

/* Ogni app in una card, senza linea sotto il titolo */
.projects{list-style:none; margin:0; padding:0; display:grid; gap:.5rem}
.project{
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:.25rem 1.5rem;
  padding:1.1rem 1rem; background:rgba(255,255,255,.35); border-radius:.7rem;
}
.project.compact{padding:.7rem 1rem}
.project h3{margin:0; font-size:1.25rem; letter-spacing:-.01em}
.project.compact h3{font-size:1.05rem; font-weight:600}
.project p{margin:.15rem 0 0; color:rgba(20,33,61,.78); grid-column:1}
.emo{display:inline-block; width:1.7rem}
.meta{grid-column:2; grid-row:1 / span 2; text-align:right; font-size:.9rem}
.project.compact .meta{grid-row:1}
.pills{display:flex; flex-wrap:wrap; gap:.4rem; justify-content:flex-end}
.pill{
  background:#fff; color:#14213D; border-radius:99px; padding:.2rem .8rem;
  font-weight:600; font-size:.85rem; white-space:nowrap;
}
.empty{padding:1.5rem 0; color:var(--muted)}


footer{padding:2.5rem 0 3rem; border-top:1px solid var(--line); color:var(--muted); font-size:.95rem; text-align:center}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .group-head{flex-wrap:wrap}
  .project{grid-template-columns:1fr}
  .meta,.project.compact .meta{grid-column:1; grid-row:auto; text-align:left; margin-top:.4rem}
  .pills{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){
  .po .caret{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="wrap">
  <main>
    <div class="hero">
      <h1>My contributions to open source apps</h1>
      <p>I help translate open-source applications into Italian 🇮🇹 and German 🇩🇪. Here are the apps and projects I have contributed to.</p>

      <div class="po" aria-hidden="true">
        <span class="c"># Translation in progress</span>
        <span class="msg"><span class="k">msgid</span> "Save changes"</span>
        <span class="msg"><span class="k">msgstr</span> "<mark id="typed"></mark><span class="caret"></span>"</span>
      </div>
    </div>

    <section id="projects">
      <h2>Translated projects</h2>
      <p class="lead" id="count"></p>
      <div class="filters" id="filters" role="group" aria-label="Filter by language"></div>
      <div id="list"></div>
    </section>

  </main>

  <footer>
    Made with ❤️ for open source
  </footer>
</div>

<script>
/* ============ EDIT YOUR CONTENT HERE ============ */
const groups = [
  { platform:"Weblate", emoji:"🌐", hue:215, note:"Main translation platform",
    link:"https://hosted.weblate.org/user/BenutzerX/", linkLabel:"Weblate profile", compact:true,
    projects:[
      {emoji:"🏞️", name:"Lavender Photos", langs:["it","de"]},
      {emoji:"🎙️", name:"Audile", langs:["it"]},
      {emoji:"🗺️", name:"GeoShare", langs:["it"]},
      {emoji:"🤖", name:"Dicio", langs:["it"]},
      {emoji:"💳", name:"FossWallet", langs:["it"]},
      {emoji:"🔢", name:"OpenCalc", langs:["it"]},
      {emoji:"🎵", name:"Chocola", langs:["it","de"]},
      {emoji:"🔢", name:"Vanilla", langs:["it","de"]},
      {emoji:"🔢", name:"CalcYou", langs:["it"]},
      {emoji:"🕔", name:"ClockYou", langs:["it"]},
      {emoji:"📱", name:"MA Store", langs:["it"]},
      {emoji:"🗓️", name:"MA Calendar", langs:["it"]}
    ] },
  { platform:"Crowdin", emoji:"👥", hue:265,
    link:"https://crowdin.com/profile/BenutzerX", linkLabel:"Crowdin profile",
    projects:[
      {emoji:"🏞️", name:"Gallery Compose", desc:"ReFra Gallery app", langs:["it"]},
      {emoji:"🟪", name:"Tile Shortcut", desc:"Create an Android Control Centre shortcut", langs:["it"]}
    ] },
  { platform:"FUTO", emoji:"⌨️", hue:160,
    link:"https://i18n-keyboard.futo.org/it/", linkLabel:"FUTO translations",
    projects:[ {emoji:"⌨️", name:"FUTO Keyboard", desc:"Privacy Keyboard", langs:["it"]} ] },
  { platform:"Glyph Museum", emoji:"👾", hue:340,
    link:"https://app.glyphmuseum.com/u/benutzer/", linkLabel:"Glyph Museum profile",
    projects:[ {emoji:"👾", name:"Glyph Museum", desc:"Nothing smartphone LED Matrix controller", langs:["it","de"]} ] },
  { platform:"Weblate by Jean-Luc Makiola", emoji:"🌐", hue:30,
    link:"https://weblate.dev.jeanlucmakiola.de/user/Benutzer_X/", linkLabel:"Weblate profile",
    projects:[ {emoji:"📅", name:"Agendula & Calendula", desc:"Agenda & Calendar apps", langs:["it"]} ] }
];
const LANG = { it:"🇮🇹 Italian", de:"🇩🇪 German" };
/* ================================================== */

const list = document.getElementById("list");
const filters = document.getElementById("filters");
const count = document.getElementById("count");
const total = groups.reduce((n,g) => n + g.projects.length, 0);

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text) e.textContent = text;
  return e;
}

function render(lang){
  list.innerHTML = "";
  let any = false;
  groups.forEach(g => {
    const shown = g.projects.filter(p => lang === "all" || p.langs.includes(lang));
    if(!shown.length) return;
    any = true;
    const box = el("div","group");
    box.style.setProperty("--g", `hsl(${g.hue} 90% 66%)`);
    const head = el("div","group-head");
    head.appendChild(el("div","gicon",g.emoji));
    const txt = el("div","txt");
    txt.appendChild(el("h3",null,g.platform));
    if(g.note) txt.appendChild(el("p",null,g.note));
    const a = el("a",null,g.linkLabel + " ↗");
    a.href = g.link; a.rel = "noopener";
    head.append(txt, a);
    const ul = el("ul","projects");
    shown.forEach(p => {
      const li = el("li","project" + (g.compact ? " compact" : ""));
      const h = el("h3");
      h.append(el("span","emo",p.emoji), p.name);
      li.appendChild(h);
      if(p.desc) li.appendChild(el("p",null,p.desc));
      const m = el("div","meta");
      const pills = el("div","pills");
      p.langs.forEach(l => pills.appendChild(el("span","pill",LANG[l])));
      m.appendChild(pills);
      li.appendChild(m);
      ul.appendChild(li);
    });
    box.append(head, ul);
    list.appendChild(box);
  });
  if(!any) list.appendChild(el("p","empty","No projects for this language."));
}

const codes = [...new Set(groups.flatMap(g => g.projects.flatMap(p => p.langs)))];
[["all","All"], ...codes.map(c => [c, LANG[c]])].forEach(([code, label], i) => {
  const b = el("button",null,label);
  b.type = "button";
  b.setAttribute("aria-pressed", i === 0);
  b.addEventListener("click", () => {
    filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render(code);
  });
  filters.appendChild(b);
});
if(codes.length < 2) filters.hidden = true;

count.textContent = `${total} projects across ${groups.length} platforms.`;
render("all");

/* One animation: the translation types itself, Italian then German */
const words = ["Salva le modifiche", "Änderungen speichern"];
const out = document.getElementById("typed");
if(matchMedia("(prefers-reduced-motion: reduce)").matches){
  out.textContent = words[0];
}else{
  let w = 0, i = 0;
  (function tick(){
    i++;
    out.textContent = words[w].slice(0, i);
    if(i < words[w].length) return setTimeout(tick, 80);
    if(w === 0){
      setTimeout(function erase(){
        if(--i > 0){ out.textContent = words[0].slice(0, i); return setTimeout(erase, 35); }
        out.textContent = ""; w = 1; tick();
      }, 1400);
    }
  })();
}
</script>
</body>
</html>
